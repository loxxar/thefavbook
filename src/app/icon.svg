<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <title>Dossier de favoris</title>
  <defs>
    <linearGradient id="back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fd0f5"/>
      <stop offset="1" stop-color="#4a8fd0"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfe9fb"/>
      <stop offset="0.5" stop-color="#8dc4ef"/>
      <stop offset="0.5" stop-color="#6aabe2"/>
      <stop offset="1" stop-color="#3f7fc4"/>
    </linearGradient>
  </defs>
  <!-- Dos du dossier, avec l'onglet -->
  <path fill="url(#back)" d="M2 8a2 2 0 0 1 2-2h7l2.4 2.6H28a2 2 0 0 1 2 2V13H2Z"/>
  <!-- Rabat avant, dégradé cassé en son milieu : le lustre d'Aqua -->
  <path fill="url(#front)" d="M2 11h28a2 2 0 0 1 2 2l-2.6 11.4A2 2 0 0 1 27.4 26H4.6a2 2 0 0 1-2-1.6L0 13a2 2 0 0 1 2-2Z"/>
  <!-- Reflet du rabat : une ellipse écrasée, pas une bande, sinon elle se lit
       comme une étiquette collée. -->
  <ellipse cx="16" cy="14.2" rx="12.5" ry="1.9" fill="#fff" opacity=".4"/>
</svg>
